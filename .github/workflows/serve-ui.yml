name: Serve Web UI

# Hosts the Web UI on the runner and exposes it via a Cloudflare quick tunnel.
# Run manually: Actions -> Serve Web UI -> Run workflow. The public URL is
# printed in the job summary and logs. Max lifetime ~6h (runner limit).

on:
  workflow_dispatch:
    inputs:
      uptime_minutes:
        description: "How long to keep the UI online (minutes, max ~360)"
        required: false
        default: "300"
      opencode_version:
        description: "opencode backend version"
        required: false
        default: "1.19.3"

env:
  UI_PORT: "3000"
  API_PORT: "4096"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install opencode backend
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) OC_ARCH="x64" ;;
            aarch64|arm64) OC_ARCH="arm64" ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -sL -o /tmp/oc.tar.gz \
            "https://github.com/anomalyco/opencode/releases/download/v${{ inputs.opencode_version }}/opencode-linux-${OC_ARCH}.tar.gz"
          mkdir -p /tmp/oc && tar xzf /tmp/oc.tar.gz -C /tmp/oc
          /tmp/oc/opencode --version

      - name: Start backend and UI server
        run: |
          mkdir -p /tmp/demo && echo "# demo" > /tmp/demo/README.md
          cd /tmp/demo
          /tmp/oc/opencode serve --hostname 127.0.0.1 --port "$API_PORT" --print-logs > /tmp/backend.log 2>&1 &
          cd "$GITHUB_WORKSPACE/app-prefixable"
          bun install
          PORT="$UI_PORT" API_URL="http://127.0.0.1:$API_PORT" bun run dev > /tmp/ui.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://127.0.0.1:$UI_PORT/" && break
            sleep 2
          done
          curl -sf -o /dev/null "http://127.0.0.1:$UI_PORT/"

      - name: Install cloudflared
        run: |
          curl -sL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Expose UI via quick tunnel
        run: |
          /tmp/cloudflared tunnel --url "http://127.0.0.1:$UI_PORT" > /tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel URL not found:"
            tail -20 /tmp/tunnel.log
            exit 1
          fi
          echo "## Web UI is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          printf '%s\n' "$URL" > /tmp/tunnel-url.txt

      - name: Publish tunnel URL
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/tunnel-url.txt
          retention-days: 1

      - name: Keep alive
        run: |
          echo "Serving $PUBLIC_URL for ${{ inputs.uptime_minutes }} minutes"
          sleep $(( ${{ inputs.uptime_minutes }} * 60 ))
